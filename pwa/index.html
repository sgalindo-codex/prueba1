<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LEDUNI">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>LEDUNI Controller</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #ffffff;
      --bg: #000000;
      --glass: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.10);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 44px);
      --safe-bot: env(safe-area-inset-bottom, 34px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── Room background glow ───────────────────────────── */
    #room-bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -10%, var(--room-color, transparent), transparent 70%);
      transition: background 0.4s ease;
      pointer-events: none;
    }

    /* ── Scroll container ───────────────────────────────── */
    #app {
      position: relative; z-index: 1;
      max-width: 430px; margin: 0 auto;
      padding: calc(var(--safe-top) + 16px) 20px calc(var(--safe-bot) + 24px);
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 8px 0 4px;
    }

    .header-icon {
      font-size: 44px; line-height: 1;
      filter: drop-shadow(0 0 16px var(--accent));
      transition: filter 0.3s, color 0.3s;
    }

    .header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

    .header-sub { font-size: 13px; color: rgba(255,255,255,0.45); }

    /* ── Glass card ─────────────────────────────────────── */
    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .card-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 600; margin-bottom: 14px;
    }

    .card-label span:first-child { font-size: 18px; }

    /* ── Power button ───────────────────────────────────── */
    .power-wrap { display: flex; justify-content: center; }

    #btn-power {
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s ease;
      -webkit-appearance: none; outline: none;
    }

    #btn-power svg { width: 38px; height: 38px; transition: stroke 0.3s; stroke: #666; }

    #btn-power.on {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      box-shadow: 0 0 28px color-mix(in srgb, var(--accent) 50%, transparent);
    }

    #btn-power.on svg { stroke: var(--accent); }

    #btn-power:active { transform: scale(0.93); }

    /* ── Slider ─────────────────────────────────────────── */
    .slider-row { display: flex; align-items: center; gap: 10px; }

    .slider-icon { font-size: 18px; flex-shrink: 0; }

    input[type=range] {
      -webkit-appearance: none; appearance: none;
      flex: 1; height: 6px; border-radius: 3px;
      background: rgba(255,255,255,0.12);
      outline: none; cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent); border: none;
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .slider-val {
      font-size: 13px; color: rgba(255,255,255,0.45);
      font-variant-numeric: tabular-nums; min-width: 34px; text-align: right;
    }

    /* ── Color palette ──────────────────────────────────── */
    .color-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
    }

    .color-btn {
      aspect-ratio: 1; border-radius: 50%; border: 2.5px solid transparent;
      cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none; outline: none;
    }

    .color-btn.active {
      border-color: #fff;
      box-shadow: 0 0 12px var(--btn-color);
      transform: scale(1.12);
    }

    .color-btn:active { transform: scale(0.9); }

    /* ── Effects grid ───────────────────────────────────── */
    .effects-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }

    .effect-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 12px; border-radius: 12px;
      background: rgba(255,255,255,0.05); border: 1.5px solid transparent;
      font-size: 13px; color: rgba(255,255,255,0.5);
      cursor: pointer; transition: all 0.2s; text-align: left;
      -webkit-appearance: none; outline: none;
    }

    .effect-btn.active {
      background: rgba(160,100,255,0.2);
      border-color: #a064ff;
      color: #bf96ff;
    }

    .effect-btn:active { transform: scale(0.95); }

    .effect-icon { font-size: 16px; flex-shrink: 0; }

    /* ── Connection status ──────────────────────────────── */
    .status-bar {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 12px; color: rgba(255,255,255,0.35);
    }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #f5a623; /* orange = sim mode */
      flex-shrink: 0;
    }

    .status-dot.connected { background: #4cd964; }
    .status-dot.error     { background: #ff3b30; }

    /* ── Disabled state ─────────────────────────────────── */
    .card.disabled { opacity: 0.45; pointer-events: none; }

    /* ── Animations ─────────────────────────────────────── */
    @keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    .pop { animation: pop 0.25s ease; }
  </style>
</head>
<body>

<div id="room-bg"></div>

<div id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-icon" id="header-icon">💡</div>
    <div class="header-title">LEDUNI Controller</div>
    <div class="header-sub" id="header-sub">Apagada</div>
  </div>

  <!-- Power -->
  <div class="card">
    <div class="power-wrap">
      <button id="btn-power" aria-label="Encender / Apagar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v6"/>
          <path d="M6.34 6.34A9 9 0 1 0 17.66 6.34"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Brightness -->
  <div class="card" id="card-brightness">
    <div class="card-label"><span>☀️</span><span>Brillo</span><span id="brightness-val" style="margin-left:auto;font-size:13px;color:rgba(255,255,255,.4)">80%</span></div>
    <div class="slider-row">
      <span class="slider-icon">🌑</span>
      <input type="range" id="slider-brightness" min="5" max="100" value="80">
      <span class="slider-icon">🌕</span>
    </div>
  </div>

  <!-- Colors -->
  <div class="card" id="card-colors">
    <div class="card-label"><span>🎨</span><span>Color</span></div>
    <div class="color-grid" id="color-grid"></div>
  </div>

  <!-- Effects -->
  <div class="card" id="card-effects">
    <div class="card-label"><span>✨</span><span>Efecto</span></div>
    <div class="effects-grid" id="effects-grid"></div>
  </div>

  <!-- Effect speed -->
  <div class="card" id="card-speed">
    <div class="card-label"><span>⚡</span><span>Velocidad del efecto</span><span id="speed-val" style="margin-left:auto;font-size:13px;color:rgba(255,255,255,.4)">50%</span></div>
    <div class="slider-row">
      <span class="slider-icon">🐢</span>
      <input type="range" id="slider-speed" min="0" max="100" value="50">
      <span class="slider-icon">🐇</span>
    </div>
  </div>

  <!-- Connection status -->
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Modo simulación</span>
  </div>

</div>

<script>
// ── Datos ────────────────────────────────────────────────────
const COLORS = [
  { name:'Blanco',       hex:'#ffffff', rf:0x00 },
  { name:'Rojo',         hex:'#ff2020', rf:0x01 },
  { name:'Verde',        hex:'#00ff44', rf:0x02 },
  { name:'Azul',         hex:'#1a6aff', rf:0x03 },
  { name:'Amarillo',     hex:'#ffe800', rf:0x04 },
  { name:'Cian',         hex:'#00ffff', rf:0x05 },
  { name:'Magenta',      hex:'#ff00ff', rf:0x06 },
  { name:'Naranja',      hex:'#ff8000', rf:0x07 },
  { name:'Rosa',         hex:'#ff66b2', rf:0x08 },
  { name:'Lavanda',      hex:'#b380ff', rf:0x09 },
  { name:'Turquesa',     hex:'#00cc99', rf:0x0A },
  { name:'Blanco cálido',hex:'#ffd99a', rf:0x0B },
];

const EFFECTS = [
  { name:'Estático',          icon:'💡', rf:0x20 },
  { name:'Flash',             icon:'⚡', rf:0x21 },
  { name:'Estroboscópico',    icon:'📸', rf:0x22 },
  { name:'Fundido',           icon:'🌅', rf:0x23 },
  { name:'Transición suave',  icon:'🌊', rf:0x24 },
  { name:'Salto 3 colores',   icon:'🔀', rf:0x25 },
  { name:'Salto 7 colores',   icon:'🌈', rf:0x26 },
  { name:'Fundido 3 colores', icon:'💧', rf:0x27 },
  { name:'Fundido 7 colores', icon:'✨', rf:0x28 },
];

// ── Estado ───────────────────────────────────────────────────
const state = {
  on:             false,
  brightness:     80,
  colorIdx:       0,
  effectIdx:      0,
  speed:          50,
  simulationMode: true,
  controllerIP:   '192.168.1.100',
  controllerPort: 8080,
};

// ── Referencias DOM ──────────────────────────────────────────
const btnPower       = document.getElementById('btn-power');
const headerIcon     = document.getElementById('header-icon');
const headerSub      = document.getElementById('header-sub');
const roomBg         = document.getElementById('room-bg');
const sliderBright   = document.getElementById('slider-brightness');
const brightVal      = document.getElementById('brightness-val');
const colorGrid      = document.getElementById('color-grid');
const effectsGrid    = document.getElementById('effects-grid');
const sliderSpeed    = document.getElementById('slider-speed');
const speedVal       = document.getElementById('speed-val');
const statusDot      = document.getElementById('status-dot');
const statusText     = document.getElementById('status-text');
const cardBrightness = document.getElementById('card-brightness');
const cardColors     = document.getElementById('card-colors');
const cardEffects    = document.getElementById('card-effects');
const cardSpeed      = document.getElementById('card-speed');

// ── Render ───────────────────────────────────────────────────
function buildColorGrid() {
  colorGrid.innerHTML = '';
  COLORS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'color-btn' + (i === state.colorIdx ? ' active' : '');
    btn.style.background = c.hex;
    btn.style.setProperty('--btn-color', c.hex);
    btn.title = c.name;
    btn.addEventListener('click', () => selectColor(i));
    colorGrid.appendChild(btn);
  });
}

function buildEffectsGrid() {
  effectsGrid.innerHTML = '';
  EFFECTS.forEach((e, i) => {
    const btn = document.createElement('button');
    btn.className = 'effect-btn' + (i === state.effectIdx ? ' active' : '');
    btn.innerHTML = `<span class="effect-icon">${e.icon}</span><span>${e.name}</span>`;
    btn.addEventListener('click', () => selectEffect(i));
    effectsGrid.appendChild(btn);
  });
}

function updateAccent() {
  const hex = COLORS[state.colorIdx].hex;
  document.documentElement.style.setProperty('--accent', hex);
  // Sliders
  sliderBright.style.setProperty('--accent', hex);
}

function updateRoomBg() {
  if (!state.on) {
    roomBg.style.setProperty('--room-color', 'transparent');
    return;
  }
  const hex  = COLORS[state.colorIdx].hex;
  const alpha = state.brightness / 100;
  // hex → rgba
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  roomBg.style.setProperty('--room-color', `rgba(${r},${g},${b},${alpha})`);
}

function renderAll() {
  // Power
  btnPower.classList.toggle('on', state.on);
  headerIcon.style.filter = state.on
    ? `drop-shadow(0 0 20px ${COLORS[state.colorIdx].hex})`
    : '';
  headerSub.textContent = state.on
    ? `Encendida · ${COLORS[state.colorIdx].name}`
    : 'Apagada';

  // Disabled cards
  [cardBrightness, cardColors, cardEffects, cardSpeed].forEach(c =>
    c.classList.toggle('disabled', !state.on)
  );

  // Sliders
  brightVal.textContent = state.brightness + '%';
  speedVal.textContent  = state.speed + '%';

  updateAccent();
  updateRoomBg();

  // Color buttons
  document.querySelectorAll('.color-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === state.colorIdx);
  });

  // Effect buttons
  document.querySelectorAll('.effect-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === state.effectIdx);
  });
}

// ── Acciones ─────────────────────────────────────────────────
function togglePower() {
  state.on = !state.on;
  vibrate(10);
  sendCommand(state.on ? 0x10 : 0x11, 0);
  renderAll();
  // Animación pop en el icono
  headerIcon.classList.remove('pop');
  void headerIcon.offsetWidth;
  headerIcon.classList.add('pop');
}

function selectColor(i) {
  state.colorIdx = i;
  vibrate(6);
  sendCommand(0x13, COLORS[i].rf);
  renderAll();
}

function selectEffect(i) {
  state.effectIdx = i;
  vibrate(6);
  sendCommand(0x14, EFFECTS[i].rf);
  renderAll();
}

function onBrightnessChange(val) {
  state.brightness = +val;
  brightVal.textContent = val + '%';
  updateRoomBg();
  sendCommand(0x12, Math.round(val * 2.55));
}

function onSpeedChange(val) {
  state.speed = +val;
  speedVal.textContent = val + '%';
  sendCommand(0x15, Math.round(val * 2.55));
}

// ── Vibración háptica ────────────────────────────────────────
function vibrate(ms) {
  if ('vibrate' in navigator) navigator.vibrate(ms);
}

// ── Comunicación con ESP32 ───────────────────────────────────
async function sendCommand(cmd, param) {
  if (state.simulationMode) {
    console.log(`[SIM] CMD=0x${cmd.toString(16).padStart(2,'0')} PARAM=0x${param.toString(16).padStart(2,'0')}`);
    return;
  }
  const url = `http://${state.controllerIP}:${state.controllerPort}/command`;
  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd, param }),
      signal: AbortSignal.timeout(3000),
    });
    setConnected(true);
  } catch (e) {
    console.warn('[RF] Error:', e.message);
    setConnected(false);
  }
}

async function ping() {
  if (state.simulationMode) return;
  const url = `http://${state.controllerIP}:${state.controllerPort}/ping`;
  try {
    await fetch(url, { signal: AbortSignal.timeout(3000) });
    setConnected(true);
  } catch {
    setConnected(false);
  }
}

function setConnected(ok) {
  statusDot.className = 'status-dot ' + (ok ? 'connected' : 'error');
  statusText.textContent = ok ? 'Conectado al controlador' : 'Sin conexión';
}

// ── Event listeners ──────────────────────────────────────────
btnPower.addEventListener('click', togglePower);

sliderBright.addEventListener('input', e => onBrightnessChange(e.target.value));
sliderSpeed.addEventListener('input',  e => onSpeedChange(e.target.value));

// Deslizar hacia el color mientras se arrastra
sliderBright.addEventListener('input', () => updateRoomBg());

// ── Init ─────────────────────────────────────────────────────
buildColorGrid();
buildEffectsGrid();
renderAll();
ping();

// Registrar Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── Configuración (se puede cambiar desde consola del navegador) ──
// Para conectar hardware real:
//   leduni.setController('192.168.1.100')
window.leduni = {
  setController(ip, port = 8080) {
    state.controllerIP   = ip;
    state.controllerPort = port;
    state.simulationMode = false;
    statusDot.className  = 'status-dot';
    statusText.textContent = 'Conectando...';
    ping();
  },
  setSimulation() {
    state.simulationMode = true;
    statusDot.className  = 'status-dot';
    statusText.textContent = 'Modo simulación';
  }
};
</script>
</body>
</html>
